<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emperico Partner Diagnostics - Admin</title>
<style>
  :root{
    --bg:#f3efe6; --panel:#fbf9f4; --border:#ddd2ba;
    --text:#152238; --text-soft:#33415f; --text-muted:#847b64;
    --accent:#0d1c39; --accent-strong:#a08243;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.5;
  }
  .wrap{ max-width:920px; margin:0 auto; padding:50px 24px 90px; }
  h1{ font-family:Georgia,serif; font-size:28px; margin:0 0 6px; }
  .muted{ color:var(--text-muted); }
  .panel{ background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:26px; margin-top:22px; }
  label{ display:block; font-size:13px; color:var(--text-muted); margin-bottom:5px; }
  input, select{
    width:100%; font-size:15px; padding:10px 12px; border:1px solid var(--border); border-radius:3px;
    background:#fff; color:var(--text); font-family:inherit; margin-bottom:16px;
  }
  .row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  button{
    font-size:15px; font-weight:600; padding:10px 20px; border-radius:3px; border:1px solid var(--accent);
    background:var(--accent); color:#f3efe6; cursor:pointer;
  }
  button.ghost{ background:transparent; color:var(--text); border-color:var(--border); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  #login-error, #create-error{ color:#b3432b; font-size:13.5px; min-height:18px; margin-top:4px; }
  #link-result{ margin-top:16px; padding:14px; border:1px solid var(--border); border-radius:3px; background:#fff; display:none; }
  #link-result input{ margin-bottom:8px; }
  table{ width:100%; border-collapse:collapse; margin-top:6px; font-size:14px; }
  th{ text-align:left; font-size:12px; color:var(--text-muted); font-weight:600; padding:8px 8px; border-bottom:1px solid var(--border); }
  td{ padding:10px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  .status-pending{ color:var(--text-muted); }
  .status-completed{ color:#3a7048; font-weight:600; }
  .copy-btn{ font-size:12.5px; padding:5px 10px; }
  #dashboard{ display:none; }
  tbody tr{ cursor:pointer; }
  tbody tr:hover{ background:#f2ecd9; }

  .overlay{
    display:none; position:fixed; inset:0; background:rgba(21,34,56,.45);
    align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; z-index:50;
  }
  .overlay.active{ display:flex; }
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:4px;
    max-width:920px; width:100%; padding:34px; position:relative;
  }
  .modal-close{
    position:absolute; top:20px; right:20px; background:transparent; border:none;
    font-size:22px; color:var(--text-muted); cursor:pointer; padding:0; line-height:1;
  }
  .modal h2{ font-family:Georgia,serif; margin:0 0 4px; }
  .modal .modal-sub{ color:var(--text-muted); font-size:13.5px; margin-bottom:4px; }
  .modal-band{
    display:inline-block; margin-top:14px; padding:7px 16px; border-radius:3px;
    background:var(--accent); color:#f3efe6; font-size:13.5px; font-weight:600;
  }
  .modal h3{ font-family:Georgia,serif; font-size:19px; margin:32px 0 4px; }
  .modal .h3-sub{ font-size:13px; color:var(--text-muted); margin-bottom:16px; }

  .radar-wrap{ display:flex; justify-content:center; margin:10px 0 6px; }
  .legend{ display:flex; flex-wrap:wrap; gap:16px; justify-content:center; font-size:12.5px; color:var(--text-muted); margin-bottom:6px; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:9px; height:9px; border-radius:50%; display:inline-block; }

  .start-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; }
  .start-card{ border:1px solid var(--border); border-top:3px solid #9a3b2b; border-radius:3px; padding:18px; background:#fff; }
  .start-card .sc-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px; }
  .start-card .sc-head h4{ font-family:Georgia,serif; font-size:16px; margin:0; }
  .start-card .sc-score{ font-family:Georgia,serif; font-size:20px; }
  .start-card .sc-band{ font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); margin-bottom:12px; }
  .start-card .sc-label{ font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); margin:12px 0 6px; }
  .start-card ul{ margin:0; padding-left:16px; }
  .start-card li{ font-size:13px; margin-bottom:5px; }
  .start-card .sc-low{ font-size:12.5px; color:var(--text-soft); }

  .strength-line{ display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid var(--border); font-size:14px; }
  .strength-line:first-child{ border-top:none; }

  table.full-table{ width:100%; border-collapse:collapse; margin-top:6px; }
  table.full-table th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.02em; color:var(--text-muted); padding-bottom:8px; border-bottom:1px solid var(--border); }
  table.full-table td{ padding:10px 8px 10px 0; border-bottom:1px solid var(--border); font-size:14px; vertical-align:middle; }
  .ft-bar-track{ height:8px; background:var(--border); border-radius:4px; overflow:hidden; width:100%; }
  .ft-bar-fill{ height:100%; border-radius:4px; }
  .ft-tag{ display:inline-block; font-size:11.5px; padding:3px 10px; border-radius:100px; color:#fff; white-space:nowrap; }

  .style-line{ font-size:15px; margin-bottom:6px; }
  .style-net{ font-size:13px; color:var(--text-muted); margin-bottom:10px; }
  .refl-q{ font-size:12.5px; text-transform:uppercase; letter-spacing:.02em; color:var(--text-muted); margin:14px 0 3px; }
  .refl-a{ font-size:14.5px; white-space:pre-wrap; }
  .no-data{ color:var(--text-muted); font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Emperico Partner Diagnostics</h1>
  <p class="muted">Internal link generator - not for external sharing.</p>

  <div id="login-screen" class="panel">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div id="login-error"></div>
    <button onclick="login()">Log in</button>
  </div>

  <div id="dashboard">
    <div class="panel">
      <h2 style="margin-top:0;">Create a link</h2>
      <div class="row">
        <div><label for="c-name">Name</label><input id="c-name" type="text"></div>
        <div><label for="c-email">Email</label><input id="c-email" type="email"></div>
      </div>
      <div class="row">
        <div>
          <label for="c-tool">Tool</label>
          <select id="c-tool">
            <option value="partner-track">The Partner Track</option>
            <option value="practising-partner">The Practising Partner</option>
            <option value="firm-leader">The Firm Leader</option>
          </select>
        </div>
        <div>
          <label for="c-edition">Edition</label>
          <select id="c-edition">
            <option value="A">Traditional partnership</option>
            <option value="B">PE / corporate-backed</option>
          </select>
        </div>
      </div>
      <div id="create-error"></div>
      <button onclick="createLink()">Generate link</button>
      <div id="link-result">
        <label>Bespoke link (copy this into your own email to send)</label>
        <input id="link-url" type="text" readonly onclick="this.select()">
        <button class="ghost copy-btn" onclick="copyLink()">Copy</button>
      </div>
    </div>

    <div class="panel">
      <h2 style="margin-top:0;">All links</h2>
      <table id="links-table">
        <thead>
          <tr><th>Name</th><th>Email</th><th>Tool</th><th>Edition</th><th>Status</th><th>Created</th><th>Overall</th></tr>
        </thead>
        <tbody id="links-body"></tbody>
      </table>
      <p id="links-empty" class="muted" style="display:none;">No links created yet.</p>
    </div>
  </div>
</div>

<div class="overlay" id="detail-overlay" onclick="if(event.target===this) closeDetail()">
  <div class="modal">
    <button class="modal-close" onclick="closeDetail()">&times;</button>
    <div id="detail-body"></div>
  </div>
</div>

<script>
const TOOL_LABELS = {
  "partner-track": "The Partner Track",
  "practising-partner": "The Practising Partner",
  "firm-leader": "The Firm Leader"
};

async function checkAuth(){
  const r = await fetch('/api/admin-links');
  if(r.ok){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadLinks();
  }
}

async function login(){
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  try{
    const r = await fetch('/api/admin-login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw })
    });
    const data = await r.json();
    if(data.ok){
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadLinks();
    } else {
      err.textContent = data.error || 'Incorrect password.';
    }
  }catch(e){
    err.textContent = 'Something went wrong - try again.';
  }
}

async function createLink(){
  const name = document.getElementById('c-name').value.trim();
  const email = document.getElementById('c-email').value.trim();
  const tool = document.getElementById('c-tool').value;
  const edition = document.getElementById('c-edition').value;
  const err = document.getElementById('create-error');
  err.textContent = '';

  if(!name || !email){
    err.textContent = 'Name and email are both required.';
    return;
  }

  try{
    const r = await fetch('/api/create-link', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name, email, tool, edition })
    });
    const data = await r.json();
    if(data.ok){
      document.getElementById('link-result').style.display = 'block';
      document.getElementById('link-url').value = data.url;
      document.getElementById('c-name').value = '';
      document.getElementById('c-email').value = '';
      loadLinks();
    } else {
      err.textContent = data.error || 'Could not create link.';
    }
  }catch(e){
    err.textContent = 'Something went wrong - try again.';
  }
}

function copyLink(){
  const input = document.getElementById('link-url');
  input.select();
  navigator.clipboard.writeText(input.value);
}

let LINKS_CACHE = [];

async function loadLinks(){
  try{
    const r = await fetch('/api/admin-links');
    const data = await r.json();
    const body = document.getElementById('links-body');
    const empty = document.getElementById('links-empty');
    body.innerHTML = '';
    LINKS_CACHE = (data.ok && data.links) ? data.links : [];
    if(!LINKS_CACHE.length){
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    LINKS_CACHE.forEach((l, i) => {
      const tr = document.createElement('tr');
      tr.addEventListener('click', () => openDetail(i));
      const created = l.createdAt ? new Date(l.createdAt).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '-';
      const overall = (l.results && l.results.overall != null) ? l.results.overall : '-';
      tr.innerHTML = `
        <td>${escapeHtml(l.name||'')}</td>
        <td>${escapeHtml(l.email||'')}</td>
        <td>${TOOL_LABELS[l.tool]||l.tool}</td>
        <td>${l.edition||''}</td>
        <td class="status-${l.status}">${l.status === 'completed' ? 'Completed' : 'Pending'}</td>
        <td>${created}</td>
        <td>${escapeHtml(String(overall))}</td>
      `;
      body.appendChild(tr);
    });
  }catch(e){}
}

function bandColor(score){
  const n = parseFloat(score) || 0;
  if(n >= 4.2) return '#8a7024';
  if(n >= 3.4) return '#2f4f7a';
  if(n >= 2.6) return '#c9a35f';
  return '#9a3b2b';
}

function buildRadarSVG(scores){
  const size = 420, cx = size/2, cy = size/2, maxR = 150;
  const n = scores.length;
  const pt = (i, r) => {
    const angle = (-90 + i * (360/n)) * Math.PI/180;
    return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
  };
  let svg = `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:460px;">`;

  // grid rings at score levels 1..5
  for(let lvl=1; lvl<=5; lvl++){
    const r = (lvl/5)*maxR;
    const pts = scores.map((_,i)=>pt(i,r).join(',')).join(' ');
    svg += `<polygon points="${pts}" fill="none" stroke="#ddd2ba" stroke-width="1"/>`;
  }
  // axis lines
  scores.forEach((_,i)=>{
    const [x,y] = pt(i, maxR);
    svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#ddd2ba" stroke-width="1"/>`;
  });
  // data polygon
  const dataPts = scores.map((s,i)=> pt(i, (Math.min(5,parseFloat(s.score)||0)/5)*maxR));
  svg += `<polygon points="${dataPts.map(p=>p.join(',')).join(' ')}" fill="#a08243" fill-opacity="0.22" stroke="#0d1c39" stroke-width="2"/>`;
  // dots + labels
  scores.forEach((s,i)=>{
    const [x,y] = dataPts[i];
    svg += `<circle cx="${x}" cy="${y}" r="6" fill="${bandColor(s.score)}" stroke="#fbf9f4" stroke-width="2"/>`;
    const [lx,ly] = pt(i, maxR + 26);
    const anchor = Math.abs(lx-cx) < 4 ? 'middle' : (lx > cx ? 'start' : 'end');
    svg += `<text x="${lx}" y="${ly}" font-size="11.5" font-family="Georgia,serif" font-weight="700" fill="#152238" text-anchor="${anchor}">${escapeHtml(s.area)}</text>`;
    svg += `<text x="${lx}" y="${ly+14}" font-size="11" font-family="-apple-system,sans-serif" fill="#847b64" text-anchor="${anchor}">${escapeHtml(String(s.score))}</text>`;
  });
  // center overall
  const overall = (scores.reduce((a,s)=>a+(parseFloat(s.score)||0),0)/n).toFixed(1);
  svg += `<circle cx="${cx}" cy="${cy}" r="34" fill="#0d1c39"/>`;
  svg += `<text x="${cx}" y="${cy-2}" font-size="20" font-family="Georgia,serif" font-weight="700" fill="#f3efe6" text-anchor="middle">${overall}</text>`;
  svg += `<text x="${cx}" y="${cy+14}" font-size="8.5" fill="#c9b489" text-anchor="middle" letter-spacing="1">OVERALL</text>`;
  svg += `</svg>`;
  return svg;
}

function openDetail(index){
  const l = LINKS_CACHE[index];
  const body = document.getElementById('detail-body');
  const created = l.createdAt ? new Date(l.createdAt).toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'}) : '-';

  if(l.status !== 'completed' || !l.results){
    body.innerHTML = `
      <h2>${escapeHtml(l.name||'')}</h2>
      <p class="modal-sub">${escapeHtml(l.email||'')} &middot; ${TOOL_LABELS[l.tool]||l.tool} &middot; Edition ${l.edition||''} &middot; Created ${created}</p>
      <p class="no-data" style="margin-top:20px;">This link is still pending &mdash; no results yet.</p>
    `;
    document.getElementById('detail-overlay').classList.add('active');
    return;
  }

  const res = l.results;
  const completed = l.completedAt ? new Date(l.completedAt).toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'}) : '-';
  const scores = Array.isArray(res.scores) ? res.scores : [];

  const radarHtml = scores.length ? buildRadarSVG(scores) : '<p class="no-data">No area scores recorded.</p>';

  let cardsHtml = '<p class="no-data">No development areas flagged.</p>';
  if(Array.isArray(res.whereToStart) && res.whereToStart.length){
    cardsHtml = '<div class="start-cards">' + res.whereToStart.map(a => {
      const color = bandColor(a.score);
      const lowHtml = (a.lowest||[]).map(x => `<div class="sc-low">"${escapeHtml(x.it)}" &mdash; ${escapeHtml(String(x.v))}/5</div>`).join('');
      const suggHtml = (a.suggestions||[]).map(s => `<li>${escapeHtml(s)}</li>`).join('');
      return `
        <div class="start-card" style="border-top-color:${color}">
          <div class="sc-head"><h4>${escapeHtml(a.area)}</h4><span class="sc-score" style="color:${color}">${escapeHtml(String(a.score))}</span></div>
          <div class="sc-band">${escapeHtml(a.band||'')}</div>
          ${lowHtml ? `<div class="sc-label">You rated lowest</div>${lowHtml}` : ''}
          ${suggHtml ? `<div class="sc-label">First move</div><ul>${suggHtml}</ul>` : ''}
        </div>`;
    }).join('') + '</div>';
  }

  let strengthsHtml = '<p class="no-data">No strengths at 3.4 or above yet.</p>';
  if(Array.isArray(res.strengths) && res.strengths.length){
    strengthsHtml = res.strengths.map(s => `
      <div class="strength-line"><span>${escapeHtml(s.area)}</span><span style="color:${bandColor(s.score)};font-weight:600;">${escapeHtml(String(s.score))} &middot; ${escapeHtml(s.band||'')}</span></div>
    `).join('');
  }

  let styleHtml = '<p class="no-data">No working-style data recorded.</p>';
  if(res.style && res.style.label){
    const net = res.style.net || {};
    const fmtN = n => (n>0?'+':'') + n;
    styleHtml = `
      <div class="style-line"><strong>${escapeHtml(res.style.label)}</strong></div>
      <div class="style-net">D ${fmtN(net.D||0)} &middot; I ${fmtN(net.I||0)} &middot; S ${fmtN(net.S||0)} &middot; C ${fmtN(net.C||0)}</div>
    `;
  }

  let reflHtml = '<p class="no-data">No reflections recorded.</p>';
  if(Array.isArray(res.reflections) && res.reflections.length){
    const withText = res.reflections.filter(r => r && r.a && String(r.a).trim().length);
    if(withText.length){
      reflHtml = withText.map(r => `<div class="refl-q">${escapeHtml(r.q||'')}</div><div class="refl-a">${escapeHtml(r.a||'')}</div>`).join('');
    }
  }

  let tableHtml = '<p class="no-data">No scores recorded.</p>';
  if(scores.length){
    const sorted = [...scores].sort((a,b)=>(parseFloat(b.score)||0)-(parseFloat(a.score)||0));
    tableHtml = `<table class="full-table">
      <tr><th>Capability area</th><th>Score</th><th style="width:40%;">&nbsp;</th><th>Band</th></tr>
      ${sorted.map(s => {
        const color = bandColor(s.score);
        const pct = Math.max(0, Math.min(100, ((parseFloat(s.score)||0)/5)*100));
        return `<tr>
          <td>${escapeHtml(s.area)}</td>
          <td style="font-family:Georgia,serif;">${escapeHtml(String(s.score))}</td>
          <td><div class="ft-bar-track"><div class="ft-bar-fill" style="width:${pct}%;background:${color};"></div></div></td>
          <td><span class="ft-tag" style="background:${color};">${escapeHtml(s.band||'')}</span></td>
        </tr>`;
      }).join('')}
    </table>`;
  }

  body.innerHTML = `
    <h2>${escapeHtml(l.name||res.name||'')}</h2>
    <p class="modal-sub">${escapeHtml(l.email||'')} &middot; ${TOOL_LABELS[l.tool]||l.tool} &middot; Edition ${l.edition||''}${res.role ? ' &middot; ' + escapeHtml(res.role) : ''}${res.line ? ' &middot; ' + escapeHtml(res.line) : ''}</p>
    <p class="modal-sub">Created ${created} &middot; Completed ${completed}</p>

    <div class="radar-wrap">${radarHtml}</div>
    <div class="legend">
      <span><i style="background:#8a7024"></i>Partner / leading standard</span>
      <span><i style="background:#2f4f7a"></i>Approaching / ready</span>
      <span><i style="background:#c9a35f"></i>Emerging / in transition</span>
      <span><i style="background:#9a3b2b"></i>Development priority</span>
    </div>

    <h3>Where to start</h3>
    <p class="h3-sub">The three lowest areas, the statements rated lowest, and a first move for each.</p>
    ${cardsHtml}

    <h3>Strengths</h3>
    <p class="h3-sub">Areas at 3.4 or above.</p>
    ${strengthsHtml}

    <h3>Working style</h3>
    ${styleHtml}

    <h3>Full results</h3>
    ${tableHtml}

    <h3>Reflections</h3>
    ${reflHtml}
  `;
  document.getElementById('detail-overlay').classList.add('active');
}

function closeDetail(){
  document.getElementById('detail-overlay').classList.remove('active');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('pw').addEventListener('keydown', (e)=>{ if(e.key==='Enter') login(); });
checkAuth();
</script>
</body>
</html>
