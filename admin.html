<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emperico Partner Diagnostics - Admin</title>
<style>
  :root{
    --bg:#f3efe6; --panel:#fbf9f4; --border:#ddd2ba;
    --text:#152238; --text-soft:#33415f; --text-muted:#847b64;
    --accent:#0d1c39; --accent-strong:#a08243;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.5;
  }
  .wrap{ max-width:920px; margin:0 auto; padding:50px 24px 90px; }
  h1{ font-family:Georgia,serif; font-size:28px; margin:0 0 6px; }
  .muted{ color:var(--text-muted); }
  .panel{ background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:26px; margin-top:22px; }
  label{ display:block; font-size:13px; color:var(--text-muted); margin-bottom:5px; }
  input, select{
    width:100%; font-size:15px; padding:10px 12px; border:1px solid var(--border); border-radius:3px;
    background:#fff; color:var(--text); font-family:inherit; margin-bottom:16px;
  }
  .row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  button{
    font-size:15px; font-weight:600; padding:10px 20px; border-radius:3px; border:1px solid var(--accent);
    background:var(--accent); color:#f3efe6; cursor:pointer;
  }
  button.ghost{ background:transparent; color:var(--text); border-color:var(--border); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  #login-error, #create-error{ color:#b3432b; font-size:13.5px; min-height:18px; margin-top:4px; }
  #link-result{ margin-top:16px; padding:14px; border:1px solid var(--border); border-radius:3px; background:#fff; display:none; }
  #link-result input{ margin-bottom:8px; }
  table{ width:100%; border-collapse:collapse; margin-top:6px; font-size:14px; }
  th{ text-align:left; font-size:12px; color:var(--text-muted); font-weight:600; padding:8px 8px; border-bottom:1px solid var(--border); }
  td{ padding:10px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  .status-pending{ color:var(--text-muted); }
  .status-completed{ color:#3a7048; font-weight:600; }
  .copy-btn{ font-size:12.5px; padding:5px 10px; }
  #dashboard{ display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Emperico Partner Diagnostics</h1>
  <p class="muted">Internal link generator - not for external sharing.</p>

  <div id="login-screen" class="panel">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div id="login-error"></div>
    <button onclick="login()">Log in</button>
  </div>

  <div id="dashboard">
    <div class="panel">
      <h2 style="margin-top:0;">Create a link</h2>
      <div class="row">
        <div><label for="c-name">Name</label><input id="c-name" type="text"></div>
        <div><label for="c-email">Email</label><input id="c-email" type="email"></div>
      </div>
      <div class="row">
        <div>
          <label for="c-tool">Tool</label>
          <select id="c-tool">
            <option value="partner-track">The Partner Track</option>
            <option value="practising-partner">The Practising Partner</option>
            <option value="firm-leader">The Firm Leader</option>
          </select>
        </div>
        <div>
          <label for="c-edition">Edition</label>
          <select id="c-edition">
            <option value="A">Traditional partnership</option>
            <option value="B">PE / corporate-backed</option>
          </select>
        </div>
      </div>
      <div id="create-error"></div>
      <button onclick="createLink()">Generate link</button>
      <div id="link-result">
        <label>Bespoke link (copy this into your own email to send)</label>
        <input id="link-url" type="text" readonly onclick="this.select()">
        <button class="ghost copy-btn" onclick="copyLink()">Copy</button>
      </div>
    </div>

    <div class="panel">
      <h2 style="margin-top:0;">All links</h2>
      <table id="links-table">
        <thead>
          <tr><th>Name</th><th>Email</th><th>Tool</th><th>Edition</th><th>Status</th><th>Created</th><th>Overall</th></tr>
        </thead>
        <tbody id="links-body"></tbody>
      </table>
      <p id="links-empty" class="muted" style="display:none;">No links created yet.</p>
    </div>
  </div>
</div>

<script>
const TOOL_LABELS = {
  "partner-track": "The Partner Track",
  "practising-partner": "The Practising Partner",
  "firm-leader": "The Firm Leader"
};

async function checkAuth(){
  const r = await fetch('/api/admin-links');
  if(r.ok){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadLinks();
  }
}

async function login(){
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  try{
    const r = await fetch('/api/admin-login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw })
    });
    const data = await r.json();
    if(data.ok){
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadLinks();
    } else {
      err.textContent = data.error || 'Incorrect password.';
    }
  }catch(e){
    err.textContent = 'Something went wrong - try again.';
  }
}

async function createLink(){
  const name = document.getElementById('c-name').value.trim();
  const email = document.getElementById('c-email').value.trim();
  const tool = document.getElementById('c-tool').value;
  const edition = document.getElementById('c-edition').value;
  const err = document.getElementById('create-error');
  err.textContent = '';

  if(!name || !email){
    err.textContent = 'Name and email are both required.';
    return;
  }

  try{
    const r = await fetch('/api/create-link', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name, email, tool, edition })
    });
    const data = await r.json();
    if(data.ok){
      document.getElementById('link-result').style.display = 'block';
      document.getElementById('link-url').value = data.url;
      document.getElementById('c-name').value = '';
      document.getElementById('c-email').value = '';
      loadLinks();
    } else {
      err.textContent = data.error || 'Could not create link.';
    }
  }catch(e){
    err.textContent = 'Something went wrong - try again.';
  }
}

function copyLink(){
  const input = document.getElementById('link-url');
  input.select();
  navigator.clipboard.writeText(input.value);
}

async function loadLinks(){
  try{
    const r = await fetch('/api/admin-links');
    const data = await r.json();
    const body = document.getElementById('links-body');
    const empty = document.getElementById('links-empty');
    body.innerHTML = '';
    if(!data.ok || !data.links.length){
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    data.links.forEach(l => {
      const tr = document.createElement('tr');
      const created = l.createdAt ? new Date(l.createdAt).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '-';
      const overall = (l.results && l.results.overall != null) ? l.results.overall : '-';
      tr.innerHTML = `
        <td>${escapeHtml(l.name||'')}</td>
        <td>${escapeHtml(l.email||'')}</td>
        <td>${TOOL_LABELS[l.tool]||l.tool}</td>
        <td>${l.edition||''}</td>
        <td class="status-${l.status}">${l.status === 'completed' ? 'Completed' : 'Pending'}</td>
        <td>${created}</td>
        <td>${escapeHtml(String(overall))}</td>
      `;
      body.appendChild(tr);
    });
  }catch(e){}
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('pw').addEventListener('keydown', (e)=>{ if(e.key==='Enter') login(); });
checkAuth();
</script>
</body>
</html>
